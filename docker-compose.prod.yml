name: orexled-backend-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: orexled-backend-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # no "ports:" on purpose — only the api container talks to postgres, over the
    # internal docker network by service name. Nothing is exposed on the host,
    # so this can never collide with the many other postgres instances on this server.
    volumes:
      - orexled_backend_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orexled-backend-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3020:3020"
    volumes:
      - orexled_backend_prod_uploads:/app/uploads

volumes:
  orexled_backend_prod_postgres_data:
  orexled_backend_prod_uploads:
